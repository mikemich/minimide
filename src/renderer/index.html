<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' mide:; script-src 'self' mide:; style-src 'self' mide: 'unsafe-inline'; img-src 'self' mide: data: https:; font-src 'self' mide: data:; connect-src 'self' mide:">
  <title>Minimide</title>
  <link rel="stylesheet" href="styles/base.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <header id="titlebar"><div class="title">Minimide</div></header>
    <div id="main">
      <aside id="sidebar" class="dock hidden">
        <nav class="dock-header"></nav>
        <div class="dock-body"></div>
      </aside>
      <div id="sidebar-resizer" class="resizer resizer-v" hidden></div>
      <section id="center">
        <div id="panes"></div>
        <div id="panel-resizer" class="resizer resizer-h" hidden></div>
        <section id="panel" class="dock hidden">
          <nav class="dock-header"></nav>
          <div class="dock-body"></div>
        </section>
      </section>
    </div>
    <footer id="statusbar"><div class="status-left"></div><div class="status-right"></div></footer>
  </div>
  <div id="overlay-root"></div>
  <div id="notifications"></div>
</body>
</html>
